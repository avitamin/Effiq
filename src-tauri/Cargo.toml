[package]
name = "effiq"
version = "0.1.0"
description = "Effiq review runner desktop app"
authors = ["Effiq"]
edition = "2021"

[lib]
name = "effiq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "effiq"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
